{% extends "admin/base.html" %}
{% block content %}
  <h1>编辑英雄：{{ hero.name_zh }}（{{ hero.name_en }}）</h1>
  <p>网址名会跟随官方英文名自动更新。当前网址名：<code>{{ hero.slug }}</code></p>
  <form method="post" action="/admin/heroes/{{ hero.id }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>官方中文名
      <input type="text" name="name_zh" value="{{ name_zh }}" required>
    </label>
    <label>官方英文名
      <input type="text" name="name_en" value="{{ name_en }}" required>
    </label>
    <button type="submit">保存</button>
    <a href="/admin/heroes">取消</a>
  </form>
{% endblock %}
