{% extends "admin/base.html" %}
{% block content %}
  <h1>英雄</h1>
  <p>英雄名称必须使用游戏内的官方中文名和官方英文名。网址名在添加时由英文名生成，之后不再改变。</p>
  <table>
    <thead><tr><th>官方中文名</th><th>官方英文名</th><th>网址名</th><th></th></tr></thead>
    <tbody>
    {% for hero in heroes %}
      <tr><td>{{ hero.name_zh }}</td><td>{{ hero.name_en }}</td><td><code>{{ hero.slug }}</code></td>
        <td><a href="{{ console_root(request) }}admin/heroes/{{ hero.id }}/edit">编辑</a></td></tr>
    {% else %}
      <tr><td colspan="4">还没有英雄。</td></tr>
    {% endfor %}
    </tbody>
  </table>

  <h2>添加英雄</h2>
  <form method="post" action="{{ console_root(request) }}admin/heroes">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>官方中文名
      <input type="text" name="name_zh" value="{{ name_zh }}" required>
    </label>
    <label>官方英文名
      <input type="text" name="name_en" value="{{ name_en }}" required>
    </label>
    <button type="submit">添加英雄</button>
  </form>
{% endblock %}
